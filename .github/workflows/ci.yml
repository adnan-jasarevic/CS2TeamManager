name: CI

on:
  push:
    branches: [master]
  pull_request:

# Least privilege for the GITHUB_TOKEN: the jobs only need to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build API
        run: dotnet build RosterSensei.Api/RosterSensei.Api.csproj --configuration Release

      - name: Run tests
        run: dotnet test RosterSensei.Tests/RosterSensei.Tests.csproj --configuration Release --logger "console;verbosity=normal"

  frontend:
    name: Frontend lint, build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RosterSensei.Client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: RosterSensei.Client/package-lock.json

      - run: npm ci
      - run: npm run lint
      # Type-checks with tsc (app and tests), then bundles with Vite.
      - run: npm run build

      # Browser tests against a mocked API; see RosterSensei.Client/e2e.
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

      - name: Upload the test report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            RosterSensei.Client/playwright-report
            RosterSensei.Client/test-results
          retention-days: 7

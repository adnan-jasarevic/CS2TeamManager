<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Roster Sensei: schedule praccs, log every map and see where your CS2 team wins." />
    <meta name="theme-color" content="#0e0b0c" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Roster Sensei" />
    <meta property="og:title" content="Roster Sensei" />
    <meta property="og:description" content="Schedule praccs, log every map and see where your CS2 team wins." />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Roster Sensei</title>
    <script>
      // Runs before first paint so a light-theme user never sees a flash of dark. Dark is the default.
      try {
        if (localStorage.getItem('rs-theme') === 'light') {
          document.documentElement.dataset.theme = 'light';
          document.querySelector('meta[name="theme-color"]').content = '#faf7f4';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
